name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-wasip1
      - run: cargo test --workspace
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Test the packed plugin with TypeScript 6, TypeScript 7 and SWC
        working-directory: transform/tests/compatibility
        run: |
          npm install --no-save "$RUNNER_TEMP"/swc-plugin-jsx-control-statements-*.tgz
          npm test
