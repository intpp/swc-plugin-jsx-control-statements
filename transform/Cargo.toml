[package]
name = "jsx_control_statements"
version = "0.7.1"
edition = "2021"

[dependencies]
swc_core = { workspace = true, features = ["common", "ecma_ast", "ecma_utils", "ecma_visit"] }
tracing = { version = "0.1.40", features = ["release_max_level_off"] }

[dev-dependencies]
testing = "29.0.0"
swc_core = { workspace = true, features = [
    "ecma_parser",
    "testing_transform",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(swc_ast_unknown)"] }
